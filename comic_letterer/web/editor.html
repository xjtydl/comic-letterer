<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comic Letterer · 漫画排字</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#161b23;color:#e7eaf0;font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{background:#303b4b;color:#f8fbff;border:1px solid #56667c;border-radius:6px;padding:8px 12px}button:hover{background:#43536b}button:disabled{opacity:.4;cursor:default}.primary{background:#acdbe0;color:#152c35;border-color:#acdbe0}header{height:65px;padding:12px 22px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #394355}header strong{font-size:18px;margin-right:auto}header small{font-size:12px;color:#9eafc4;font-weight:400;margin-left:12px}main{display:grid;grid-template-columns:minmax(500px,1fr) 330px;height:calc(100vh - 65px)}.workspace{overflow:auto;background:#202733}.toolbar{position:sticky;top:0;background:#202733ed;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid #3a4555}.toolbar label{display:flex;gap:5px;align-items:center}.toolbar span{color:#a5b5cb;font-size:12px}.canvas-wrap{padding:24px;min-width:fit-content}#stage{position:relative;margin:auto;background:white;box-shadow:0 12px 40px #0008;touch-action:none}#source-art,#lettering,#handles{position:absolute;inset:0;width:100%;height:100%}#source-art{object-fit:fill}#lettering svg,#handles{display:block;width:100%;height:100%}#handles{overflow:visible}#handles .hit{cursor:move;fill:transparent;stroke:none}#handles .hit:hover{stroke:#74e6eb;stroke-width:2;stroke-dasharray:6 4}#handles .selected{fill:none;stroke:#50d5e2;stroke-width:2;pointer-events:none}#handles circle{cursor:crosshair;stroke:#172b35;stroke-width:2}aside{overflow:auto;border-left:1px solid #394355;padding:18px}h2{font-size:16px;margin:0 0 12px}h3{font-size:13px;color:#afc1d4;font-weight:500;margin:22px 0 10px}label{display:block;color:#b3c2d2;font-size:12px;margin-bottom:9px}input,select,textarea{display:block;width:100%;margin-top:5px;padding:7px;border:1px solid #526073;border-radius:5px;color:#eef3fa;background:#222c39}input[type=checkbox]{width:auto;margin:0;display:inline}textarea{resize:vertical;line-height:1.5}textarea[readonly]{color:#e8cbaa;background:#292c34}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.inline{display:flex;gap:8px;align-items:center}.hint{font-size:12px;color:#92a5bd;line-height:1.7}.badge{background:#233e45;color:#9fe2d9;border-radius:4px;padding:3px 6px;font-size:11px}#status{font-size:12px;line-height:1.6;margin:12px 0;color:#b9d7dd;white-space:pre-wrap;overflow-wrap:anywhere}#issues{padding:0;list-style:none;font-size:12px;line-height:1.6}#issues li{padding:8px 10px;margin:5px 0;background:#382f32;border-left:3px solid #e4a788;cursor:pointer}#issues li.warning{border-color:#e0c071;background:#363429}#files a{display:inline-block;color:#bceaf1;margin:5px 10px 5px 0;font-size:12px}.advanced{margin:16px 0}.advanced textarea{font:12px ui-monospace,monospace;min-height:160px}#emphasis{margin:0 4px 4px 0;font-size:12px}#clear-emphasis{font-size:12px}.busy{opacity:.65}footer{margin-top:24px;font-size:11px;color:#7d90a9;line-height:1.8}
</style>
<style id="font-css"></style>
<header><strong>Comic Letterer <small>漫画排字工作台</small></strong><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="save">保存副本</button><button id="export-svg">导出 SVG</button><button id="export-png" class="primary">导出 SVG + PNG</button></header>
<main><section class="workspace"><div class="toolbar"><select id="zoom" aria-label="预览尺寸" style="width:145px;margin:0"><option value="fit">适合窗口</option><option value="reading">实际阅读尺寸</option><option value="master">原始尺寸</option></select><label><input id="show-protected" type="checkbox">保护区域</label><label><input id="show-handles" type="checkbox" checked>编辑手柄</label><span id="dimensions"></span></div><div class="canvas-wrap"><div id="stage"><img id="source-art" alt="原始漫画画稿"><div id="lettering"></div><svg id="handles"></svg></div></div></section>
<aside><h2>排字与声源</h2><label>选择对白 / 音效<select id="item"></select></label><div class="hint">拖动框体移动；蓝点缩放；绿点定位声源；紫点调整连接曲线。</div><h3>文字 <span id="frozen" class="badge"></span></h3><textarea id="source-text" rows="3" aria-label="原文"></textarea><div class="hint">冻结原文可选择，不能改写。选中文字可放大强调。</div><button id="emphasis">强调选中文字</button><button id="clear-emphasis">清除强调</button><label>强调字形<select id="emphasis-role"><option value="">放大字号</option></select></label><label>强调基线位移（px，负值上移）<input id="emphasis-shift" type="number" value="0" step="0.5"></label><button id="keep-phrase">保护选中词组</button><button id="clear-phrase">清除词组保护</button><label>手动断行（仅调整换行位置）<textarea id="lines" rows="3"></textarea></label><button id="apply-lines">应用断行</button><div class="grid" style="margin-top:15px"><label>类型<select id="kind"></select></label><label>轮廓<select id="shape"><option value="">默认</option><option value="ellipse">椭圆</option><option value="tv">电视形</option><option value="organic">自然不对称</option><option value="tattered">破损旁白框</option><option value="mechanical">机械分层虚线</option><option value="sawtooth">偏斜锯齿</option><option value="flame">火焰边</option><option value="scroll">卷轴旁白</option><option value="flat">圆角平边</option><option value="custom">手修曲线</option></select></label><label>字体用途<select id="font-role"></select></label><label>字号<input id="font-size" type="number" min="1"></label><label>对齐<select id="align"><option value="center">居中</option><option value="left">左对齐</option><option value="right">右对齐</option></select></label><label>自动排文<select id="flow"><option value="legacy">逐行填满</option><option value="balanced">均衡行长</option></select></label></div><div class="grid"><label>字距（px）<input id="tracking" type="number" step="0.2"></label><label>横向比例<input id="horizontal-scale" type="number" min="0.9" max="1.1" step="0.01"></label></div><details><summary>字体特性与逐行宽度</summary><label>语言<input id="type-language" placeholder="zh-CN / en"></label><label>OpenType 特性（JSON）<textarea id="type-features" rows="2"></textarea></label><label>逐行最大宽度（像素数组）<input id="type-widths"></label><label>逐行横向比例（0.9–1.1）<input id="type-scales"></label><button id="apply-type">应用排版参数</button><div class="hint">不改原文。手修气泡可拖动粉色曲线控制点；画内文字可拖动金色表面四角。</div></details><label>对白基线<select id="baseline-mode"><option value="straight">平直</option><option value="bounce">跳动</option><option value="wave">波形</option></select></label><div class="grid"><label>起伏幅度（px）<input id="baseline-amplitude" type="number" min="0" step="0.5"></label><label>每组字数<input id="baseline-group" type="number" min="1" max="12"></label></div><div id="edge-controls" class="grid"><label>齿间距（px）<input id="edge-spacing" type="number" min="8" max="128"></label><label>齿深（px）<input id="edge-depth" type="number" min="1"></label></div><div id="mechanical-controls" class="grid"><label>机械描边带宽<input id="mechanical-band" type="number" min="2" max="24"></label><label>断续线段长度<input id="mechanical-dash" type="number" min="1"></label><label>断续线段间隔<input id="mechanical-gap" type="number" min="1"></label><label>四角切口比例<input id="mechanical-notch" type="number" min="0.02" max="0.16" step="0.01"></label></div><label id="scroll-controls">卷轴卷边宽度<input id="scroll-curl" type="number" min="4"></label><label><input id="drop-enabled" type="checkbox"> 下沉首字（正文绕排）</label><div id="drop-controls"><div class="grid"><label>跨行数<input id="drop-lines" type="number" min="2" max="4"></label><label>首字字符数<input id="drop-count" type="number" min="1" max="4"></label><label>与正文间距<input id="drop-gap" type="number" min="0" step="0.5"></label><label>首字颜色<input id="drop-color" type="color"></label></div><label>首字字体<select id="drop-role"><option value="">沿用正文字体</option></select></label></div><label>旁白来源<select id="caption-type"><option value="">未指定</option><option value="location">地点</option><option value="time">时间</option><option value="inner">内心独白</option><option value="spoken">画外叙述</option><option value="editorial">编辑注释</option></select></label><label>声音表达<select id="voice"><option value="normal">普通</option><option value="rough">粗糙 / 失真</option><option value="breath">喘息</option><option value="singing">歌唱</option><option value="telepathic">心灵感应</option></select></label><h3>位置与大小</h3><button id="fit">按文字拟合气泡</button><div class="grid"><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>宽<input id="w" type="number" min="1"></label><label>高<input id="h" type="number" min="1"></label><label>声源 X<input id="tx" type="number"></label><label>声源 Y<input id="ty" type="number"></label></div><h3>尾巴精修</h3><label><input id="tail-visible" type="checkbox"> 显示认主尾</label><div class="grid"><label>尾根宽<input id="tail-width" type="number" min="1"></label><label>尾长上限<input id="tail-length" type="number" min="0"></label><label>声源间隙<input id="tail-gap" type="number" min="0"></label><label>根部角度<input id="tail-angle" type="number"></label></div><button id="tail-curve">添加曲线控制点</button><button id="tail-reset">恢复默认尾巴</button><details class="advanced"><summary>高级参数</summary><p class="hint">修改当前项的描边、音效变形、连接和贴边参数。冻结原文仍受保护。</p><textarea id="advanced" aria-label="当前项 JSON"></textarea><button id="apply-advanced">应用参数</button></details><details class="advanced"><summary>全页样式与墨线参考</summary><p class="hint">样式可跨页复用；墨线参考由人工标记，用于提醒擦边问题。</p><textarea id="page-settings" aria-label="全页样式"></textarea><button id="apply-page">应用全页设置</button></details><h3>检查与输出</h3><div id="status" role="status">正在载入…</div><div id="files"></div><ul id="issues"></ul><footer>保存与导出始终创建新文件。检查通过后仍需审看声源、阅读顺序与画面遮挡。</footer></aside></main>
<script>
const roleLabel=r=>({body:'对白字体',display:'音效字体',bold:'粗体',italic:'斜体',bold_italic:'粗斜体',narrator:'旁白字体'}[r]||r);
const token='__TOKEN__',$=id=>document.getElementById(id),clone=x=>structuredClone(x);
let job,report,selected,frozen=[],history=[],future=[],request=0,ready=false;
const kinds={speech:'对白',whisper:'耳语',shout:'喊叫',thought:'思想',electronic:'电子声',caption:'旁白框',floating:'浮动文字',sfx:'音效',weak:'虚弱声'};
Object.entries(kinds).forEach(([value,label])=>$('kind').add(new Option(label,value)));
function status(text){$('status').textContent=text}
async function api(path,payload){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Token':token},body:JSON.stringify(payload)});const result=await r.json();if(!r.ok)throw Error(result.error);return result}
function current(){return job.items.find(i=>i.id===selected)}
function checkpoint(){history.push(clone(job));if(history.length>80)history.shift();future=[];buttons()}
function buttons(){$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function setPreview(result){report=result.report;$('font-css').textContent=result.css;$('lettering').innerHTML=result.svg;draw();showReport();}
function showReport(){const errors=report.issues.filter(i=>i.severity==='error').length;status(errors?`${errors} 项需修正；当前为诊断稿。`:`检查通过 · ${job.items.length} 项排字${report.issues.length?' · 有提醒待审看':''}`);$('issues').replaceChildren();for(const issue of report.issues){const li=document.createElement('li');li.className=issue.severity;li.textContent=`${issue.item}: ${issue.message}`;li.onclick=()=>select(issue.item);$('issues').append(li)}for(const item of report.items||[])for(const advice of item.language_advice?.findings||[]){const li=document.createElement('li');li.textContent=`语言建议 · ${item.id}: ${advice.message}`;li.onclick=()=>select(item.id);$('issues').append(li)}}
async function preview(){const seq=++request;try{const result=await api('/preview',{job});if(seq!==request)return;setPreview(result);refreshProperties(false)}catch(e){if(seq===request)status('参数错误：'+e.message)}}
function mutate(fn){checkpoint();fn();refreshProperties();draw();return preview()}
function select(id){if(!job.items.some(i=>i.id===id))return;selected=id;refreshProperties();draw()}
function refreshProperties(resetText=true){const raw=current();const i={...job.styles?.[raw?.style],...raw};if(!i)return;$('item').replaceChildren(...job.items.map(i=>new Option(`${i.panel} · ${i.order} · ${i.text.replaceAll('\n','').slice(0,18)}`,i.id)));$('item').value=i.id;
 $('frozen').textContent=frozen.includes(i.id)?'原文已冻结':'可编辑原文';$('source-text').readOnly=frozen.includes(i.id);if(resetText)$('source-text').value=i.text;
 let lines=report?.items.find(r=>r.id===i.id)?.lines;if(i.breaks){const chars=[...i.text],points=[0,...i.breaks,chars.length];lines=points.slice(1).map((n,k)=>chars.slice(points[k],n).join(''))}if(resetText)$('lines').value=(lines||[i.text]).join('\n');
 for(const [id,key,def] of [['kind','kind','speech'],['shape','shape',''],['font-role','font_role','body'],['font-size','font_size',24],['align','align','center'],['flow','flow','legacy']])$(id).value=i[key]??def;
 ['x','y','w','h'].forEach((key,k)=>$(key).value=i.box?.[k]??'');['tx','ty'].forEach((key,k)=>{$(key).value=i.target?.[k]??'';$(key).disabled=!i.target});$('advanced').value=JSON.stringify(raw,null,2);$('tracking').value=i.tracking??0;$('horizontal-scale').value=i.horizontal_scale??1;$('caption-type').value=i.caption_type??'';$('voice').value=i.voice??'normal';$('baseline-mode').value=i.baseline?.mode??'straight';$('baseline-amplitude').value=i.baseline?.amplitude??(i.font_size??24)*0.08;$('baseline-group').value=i.baseline?.group??2;for(const id of ['baseline-mode','baseline-amplitude','baseline-group'])$(id).disabled=i.kind==='sfx';for(const option of $('shape').options)option.disabled=['flat','custom'].includes(option.value)?!['speech','whisper','caption'].includes(i.kind):['tattered','scroll'].includes(option.value)?i.kind!=='caption':['mechanical','sawtooth','flame'].includes(option.value)?!['speech','shout','electronic'].includes(i.kind):!!option.value&&!['speech','whisper'].includes(i.kind);refreshDecorative(i);if(resetText){$('type-language').value=i.language??'';$('type-features').value=JSON.stringify(i.features??{});$('type-widths').value=JSON.stringify(i.line_widths??[]);$('type-scales').value=JSON.stringify(i.line_scales??[]);}$('caption-type').disabled=!['caption','floating'].includes(i.kind);$('voice').disabled=['caption','floating','sfx'].includes(i.kind);$('tail-visible').checked=i.tail?.visible??!i.join_to;for(const [id,key] of [['tail-width','width'],['tail-length','length'],['tail-gap','gap'],['tail-angle','root_angle']])$(id).value=i.tail?.[key]??'';$('page-settings').value=JSON.stringify({styles:job.styles||{},ink_edges:job.ink_edges||[],tangent_distance:job.tangent_distance??3,min_tail_length:job.min_tail_length??0},null,2);buttons();}
function svgNode(tag,attrs){const node=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));return node}
function draw(){if(!job)return;const canvas=$('handles');canvas.replaceChildren();canvas.setAttribute('viewBox',`0 0 ${job.width} ${job.height}`);canvas.style.pointerEvents=$('show-handles').checked?'auto':'none';
 if($('show-protected').checked)for(const r of job.protected||[]){const [x,y,width,height]=r.box;canvas.append(svgNode('rect',{x,y,width,height,fill:'#e5a35422',stroke:'#f7b759','stroke-width':2,'pointer-events':'none'}))}
 if(!$('show-handles').checked)return;
 for(const item of job.items){if(!item.box)continue;const [x,y,width,height]=item.box;const box=svgNode('rect',{x,y,width,height,class:'hit','data-item':item.id});box.onpointerdown=e=>startDrag(e,item.id,'box');canvas.append(box)}
 const i=current();if(!i?.box)return;const [x,y,width,height]=i.box;canvas.append(svgNode('rect',{x,y,width,height,class:'selected'}));
 const points=[['resize',[x+width,y+height],'#50d5e2'],...(i.target?[['target',i.target,'#95e4a3']]:[]),...(i.join_curve?[['curve',i.join_curve,'#c9a1f3']]:[]),...(i.tail?.curve?[['tailcurve',i.tail.curve,'#f3b278']]:[])];
 if(i.contour)for(const [n,c] of i.contour.curves.entries())for(let k=0;k<3;k++)points.push([`contour-${n}-${k}`,[x+c[k*2]*width,y+c[k*2+1]*height],'#f19bb7']);if(i.surface)for(const [n,p] of i.surface.entries())points.push([`surface-${n}`,p,'#f5d16d']);
 for(const [role,p,fill] of points){if(role==='target'){canvas.append(svgNode('line',{x1:x+width/2,y1:y+height/2,x2:p[0],y2:p[1],stroke:fill,'stroke-dasharray':'6 6','stroke-width':1,'pointer-events':'none'}))}const circle=svgNode('circle',{cx:p[0],cy:p[1],r:9,fill,'data-handle':role});circle.onpointerdown=e=>startDrag(e,i.id,role);canvas.append(circle)} }
function coords(e){const r=$('stage').getBoundingClientRect();return [(e.clientX-r.left)*job.width/r.width,(e.clientY-r.top)*job.height/r.height]}
function startDrag(e,id,role){if(e.button!==0)return;e.preventDefault();select(id);const start=coords(e),before=clone(job),item=current(),original=clone(item);const canvas=$('handles');canvas.setPointerCapture(e.pointerId);let changed=false;
 canvas.onpointermove=ev=>{const p=coords(ev),dx=p[0]-start[0],dy=p[1]-start[1];changed=Math.abs(dx)+Math.abs(dy)>1;if(role.startsWith('surface-')){item.surface[Number(role.split('-')[1])]=p;}else if(role.startsWith('contour-')){const [_,n,k]=role.split('-').map((v,i)=>i?Number(v):v);const q=[Math.max(0,Math.min(1,(p[0]-item.box[0])/item.box[2])),Math.max(0,Math.min(1,(p[1]-item.box[1])/item.box[3]))];item.contour.curves[n].splice(k*2,2,...q);if(n===item.contour.curves.length-1&&k===2)item.contour.start=q;}else if(role==='box'){item.box=[original.box[0]+dx,original.box[1]+dy,...original.box.slice(2)];if(original.surface)item.surface=original.surface.map(p=>[p[0]+dx,p[1]+dy]);}else if(role==='resize')item.box=[...original.box.slice(0,2),Math.max(24,original.box[2]+dx),Math.max(24,original.box[3]+dy)];else if(role==='tailcurve'){item.tail.curve=[original.tail.curve[0]+dx,original.tail.curve[1]+dy]}else {const key=role==='curve'?'join_curve':'target';item[key]=[original[key][0]+dx,original[key][1]+dy]};draw();};
 const finish=()=>{canvas.onpointermove=null;canvas.onpointerup=null;canvas.onpointercancel=null;if(changed){history.push(before);future=[];for(const key of ['box','target','join_curve'])if(item[key])item[key]=item[key].map(v=>Math.round(v*10)/10);refreshProperties();preview()}else{job=before;refreshProperties();draw()}buttons()};canvas.onpointerup=finish;canvas.onpointercancel=()=>{job=before;changed=false;finish()};}
function zoom(){if(!job)return;const mode=$('zoom').value,w=mode==='reading'?(job.reading_width||job.width):mode==='master'?job.width:Math.max(400,document.querySelector('.workspace').clientWidth-48);$('stage').style.width=w+'px';$('stage').style.height=w*job.height/job.width+'px';$('dimensions').textContent=`${Math.round(w)} px · ${Math.round(w/job.width*100)}%`;}
$('item').onchange=()=>select($('item').value);$('zoom').onchange=zoom;window.addEventListener('resize',zoom);$('show-protected').onchange=draw;$('show-handles').onchange=draw;
for(const [id,key] of [['kind','kind'],['shape','shape'],['font-role','font_role'],['align','align'],['flow','flow']])$(id).onchange=()=>mutate(()=>{const value=$(id).value;if(value)current()[key]=value;else if(key==='shape')current().shape=null;else delete current()[key];if(key==='shape'){delete current().contour;delete current().corner;if(value==='custom')current().contour={start:[.5,0],curves:[[.85,0,1,.18,1,.5],[1,.82,.85,1,.5,1],[.15,1,0,.82,0,.5],[0,.18,.15,0,.5,0]]};for(const k of ['edge','mechanical','scroll'])current()[k]=null;if(['mechanical','sawtooth','flame'].includes(value)&&['rough','telepathic'].includes(current().voice))current().voice='normal';}if(key==='kind'){current().shape=null;delete current().contour;delete current().corner;delete current().surface;delete current().material;delete current().sound;for(const k of ['edge','mechanical','scroll'])current()[k]=null;if(!['caption','floating'].includes(value))current().drop_cap=null;if(value==='sfx')current().baseline={mode:'straight'};if(!['caption','floating'].includes(value))current().caption_type=null;if(['caption','floating','sfx'].includes(value))current().voice='normal';if(value!=='sfx')for(const k of ['glyphs','hollow','arc','shadow','outlines'])delete current()[k];}if(key==='flow')delete current().breaks});
$('font-size').onchange=()=>mutate(()=>current().font_size=Number($('font-size').value));
['x','y','w','h'].forEach((key,k)=>$(key).onchange=()=>mutate(()=>current().box[k]=Number($(key).value)));['tx','ty'].forEach((key,k)=>$(key).onchange=()=>mutate(()=>current().target[k]=Number($(key).value)));
$('source-text').onchange=()=>{if(frozen.includes(selected))return;mutate(()=>{current().text=$('source-text').value;delete current().breaks;delete current().emphasis})};
$('apply-lines').onclick=()=>{const original=current().text,newLines=$('lines').value.split('\n');if(original.includes('\n')){status('此项原文含固定换行，请通过高级参数设置 breaks；不会删除原文换行。');return}if(newLines.join('')!==original){status('断行不能改变原文，包括空格和标点。');return}if(newLines.some(x=>!x)){status('不允许空行。');return}mutate(()=>{let n=0;current().breaks=newLines.slice(0,-1).map(line=>n+=[...line].length)})};
$('emphasis').onclick=()=>{const start=$('source-text').selectionStart,end=$('source-text').selectionEnd;if(start===end){status('请先在原文中选中要强调的词。');return}const t=current().text;const a=[...t.slice(0,start)].length,b=[...t.slice(0,end)].length;mutate(()=>{current().emphasis=[...(current().emphasis||[]).filter(r=>r.end<=a||r.start>=b),{start:a,end:b,baseline_shift:Number($('emphasis-shift').value),...($('emphasis-role').value?{font_role:$('emphasis-role').value,scale:1}:{scale:1.2})}]})};
for(const id of ['baseline-mode','baseline-amplitude','baseline-group'])$(id).onchange=()=>mutate(()=>{current().baseline={mode:$('baseline-mode').value,amplitude:Number($('baseline-amplitude').value),group:Number($('baseline-group').value)}});
$('clear-emphasis').onclick=()=>mutate(()=>delete current().emphasis);
$('apply-advanced').onclick=async()=>{try{const value=JSON.parse($('advanced').value);if(value.id!==selected)throw Error('不能更改当前项 ID');const next=clone(job);next.items[next.items.findIndex(i=>i.id===selected)]=value;const result=await api('/preview',{job:next});checkpoint();job=next;setPreview(result);refreshProperties()}catch(e){status(e.message)}};
$('undo').onclick=()=>{if(!history.length)return;future.push(clone(job));job=history.pop();refreshProperties();preview()};$('redo').onclick=()=>{if(!future.length)return;history.push(clone(job));job=future.pop();refreshProperties();preview()};
async function output(path,png=false){const controls=['save','export-svg','export-png'];controls.forEach(id=>$(id).disabled=true);status(path==='/save'?'正在保存副本…':'正在导出，请稍候…');try{const r=await api(path,{job:clone(job),png});status(`${r.report.ok?'已完成':'已输出诊断稿，仍有布局问题'}\n${r.path}`);$('files').replaceChildren();for(const [name,url] of Object.entries(r.files||{})){const a=document.createElement('a');a.href=url;a.textContent=name;a.target='_blank';a.rel='noopener';$('files').append(a)}}catch(e){status('未完成：'+e.message)}finally{controls.forEach(id=>$(id).disabled=false)}}
$('save').onclick=()=>output('/save');$('export-svg').onclick=()=>output('/export');$('export-png').onclick=()=>output('/export',true);
document.addEventListener('keydown',e=>{if(!ready||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click()}});
for(const [id,key] of [['tracking','tracking'],['horizontal-scale','horizontal_scale']])$(id).onchange=()=>mutate(()=>current()[key]=Number($(id).value));
for(const [id,key] of [['caption-type','caption_type'],['voice','voice']])$(id).onchange=()=>mutate(()=>{if($(id).value)current()[key]=$(id).value;else delete current()[key]});
$('keep-phrase').onclick=()=>{const t=$('source-text'),a=[...t.value.slice(0,t.selectionStart)].length,b=[...t.value.slice(0,t.selectionEnd)].length;if(a===b){status('先选中要保持完整的词组。');return}mutate(()=>{current().keep_together=[...(current().keep_together||[]),{start:a,end:b}];delete current().breaks})};
$('clear-phrase').onclick=()=>mutate(()=>delete current().keep_together);
for(const [id,key] of [['tail-width','width'],['tail-length','length'],['tail-gap','gap'],['tail-angle','root_angle']])$(id).onchange=()=>mutate(()=>{current().tail??={};if($(id).value==='')delete current().tail[key];else current().tail[key]=Number($(id).value)});
$('tail-visible').onchange=()=>mutate(()=>{current().tail??={};current().tail.visible=$('tail-visible').checked});
$('tail-curve').onclick=()=>{const i=current();if(!i.target){status('此项需要声源坐标。');return}mutate(()=>{i.tail??={};i.tail.curve=[(i.box[0]+i.box[2]/2+i.target[0])/2,(i.box[1]+i.box[3]/2+i.target[1])/2]})};
$('tail-reset').onclick=()=>mutate(()=>delete current().tail);
$('fit').onclick=async()=>{try{$('fit').disabled=true;status('按实际字体拟合中…');const r=await api('/fit',{job,item:selected});checkpoint();job=r.job;setPreview(r);refreshProperties()}catch(e){status(e.message)}finally{$('fit').disabled=false}};
$('apply-page').onclick=async()=>{try{const settings=JSON.parse($('page-settings').value);const allowed=['styles','ink_edges','tangent_distance','min_tail_length'];if(Object.keys(settings).some(k=>!allowed.includes(k)))throw Error('全页设置包含未知字段');const next={...clone(job),...settings};const r=await api('/preview',{job:next});checkpoint();job=next;setPreview(r);refreshProperties()}catch(e){status(e.message)}};
function refreshDecorative(i){
 $('edge-controls').style.display=['sawtooth','flame'].includes(i.shape)?'grid':'none';
 $('mechanical-controls').style.display=i.shape==='mechanical'?'grid':'none';$('scroll-controls').hidden=i.shape!=='scroll';
 for(const [id,value] of [['edge-spacing',i.edge?.spacing??24],['edge-depth',i.edge?.depth??Math.min(10,Math.min(...(i.box||[0,0,100,100]).slice(2))*.08)],['mechanical-band',i.mechanical?.band??7],['mechanical-dash',i.mechanical?.dash??7],['mechanical-gap',i.mechanical?.gap??5],['mechanical-notch',i.mechanical?.notch??.09],['scroll-curl',i.scroll?.curl??Math.min(18,(i.box?.[3]??100)*.2)],['drop-lines',i.drop_cap?.lines??2],['drop-count',i.drop_cap?.count??1],['drop-gap',i.drop_cap?.gap??(i.font_size??24)*.3],['drop-color',i.drop_cap?.color??'#79402c'],['drop-role',i.drop_cap?.font_role??'']])$(id).value=value;
 $('drop-enabled').checked=i.drop_cap!=null;$('drop-enabled').disabled=!['caption','floating'].includes(i.kind);$('drop-controls').hidden=i.drop_cap==null;
}
for(const [id,key,field] of [['edge-spacing','edge','spacing'],['edge-depth','edge','depth'],['mechanical-band','mechanical','band'],['mechanical-dash','mechanical','dash'],['mechanical-gap','mechanical','gap'],['mechanical-notch','mechanical','notch'],['scroll-curl','scroll','curl']])$(id).onchange=()=>mutate(()=>{const i=current();i[key]={...(job.styles?.[i.style]?.[key]||{}),...(i[key]||{}),[field]:Number($(id).value)}});
function dropSettings(){return {lines:Number($('drop-lines').value),count:Number($('drop-count').value),gap:Number($('drop-gap').value),color:$('drop-color').value,...($('drop-role').value?{font_role:$('drop-role').value}:{})}}
$('drop-enabled').onchange=()=>mutate(()=>{current().drop_cap=$('drop-enabled').checked?dropSettings():null;if(current().drop_cap)current().align='left'});
for(const id of ['drop-lines','drop-count','drop-gap','drop-color','drop-role'])$(id).onchange=()=>mutate(()=>current().drop_cap=dropSettings());
$('apply-type').onclick=async()=>{try{const next=clone(job),i=next.items.find(i=>i.id===selected);i.features=JSON.parse($('type-features').value);i.line_widths=JSON.parse($('type-widths').value);i.line_scales=JSON.parse($('type-scales').value);if($('type-language').value)i.language=$('type-language').value;else delete i.language;const r=await api('/preview',{job:next});checkpoint();job=next;setPreview(r);refreshProperties()}catch(e){status('参数错误：'+e.message)}};
fetch('/session').then(r=>r.json()).then(async data=>{job=data.job;frozen=data.frozen;selected=job.items[0].id;$('source-art').hidden=!data.has_art;if(data.has_art)$('source-art').src='/art';data.font_roles.forEach(role=>{$('font-role').add(new Option(roleLabel(role),role));$('drop-role').add(new Option(roleLabel(role),role))});data.font_roles.filter(r=>r!=='body').forEach(role=>$('emphasis-role').add(new Option(roleLabel(role),role)));setPreview(data);refreshProperties();zoom();if(data.has_art)await $('source-art').decode();await document.fonts.ready;ready=true;window.editorReady=true}).catch(e=>status('载入失败：'+e.message));
</script></html>
