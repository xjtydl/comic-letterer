[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-letterer"
version = "0.4.0"
description = "Independent, Unicode-first comic lettering with editable SVG and explicit narrative metadata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10", "fonttools>=4.40"]

[project.urls]
Repository = "https://github.com/xjtydl/comic-letterer"
Issues = "https://github.com/xjtydl/comic-letterer/issues"

[project.optional-dependencies]
png = ["playwright>=1.40"]
test = ["pytest>=8"]

[project.scripts]
comic-letterer = "comic_letterer.cli:main"

[tool.setuptools.packages.find]
include = ["comic_letterer*"]

[tool.setuptools.package-data]
comic_letterer = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
